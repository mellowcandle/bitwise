name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcunit1-dev libreadline-dev libncurses-dev
    - name: Bootstrap
      run: ./bootstrap.sh
    - name: configure
      run: ./configure --enable-gcov
    - name: make check
      run: make check
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        # Public repositories still upload without a token, but rate
        # limiting makes it flaky; add CODECOV_TOKEN as a repository
        # secret to make it reliable. A missing token must not fail the
        # build, hence fail_ci_if_error below.
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  distcheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcunit1-dev libreadline-dev libncurses-dev
    - name: Bootstrap
      run: ./bootstrap.sh
    - name: configure
      run: ./configure
    - name: make distcheck
      run: make distcheck

  sanitizers:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcunit1-dev libreadline-dev libncurses-dev
    - name: Bootstrap
      run: ./bootstrap.sh
    - name: configure
      run: ./configure --enable-asan --enable-ubsan --enable-debug
    - name: make check
      run: make check
    - name: Show test log on failure
      if: failure()
      run: cat test-suite.log tests/*.log 2>/dev/null || true
