name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcunit1-dev libreadline-dev libncurses-dev
    - name: Bootstrap
      run: ./bootstrap.sh
    - name: configure
      run: ./configure --enable-gcov
    - name: make check
      run: make check

