name: C build (OSX)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: brew install readline cunit autoconf automake
    - name: Set readline/cunit flags
      run: |
        echo "CPPFLAGS=-I$(brew --prefix readline)/include -I$(brew --prefix cunit)/include" >> "$GITHUB_ENV"
        echo "LDFLAGS=-L$(brew --prefix readline)/lib -L$(brew --prefix cunit)/lib" >> "$GITHUB_ENV"
    - name: Bootstrap
      run: ./bootstrap.sh
    - name: configure
      run: ./configure
    - name: make check
      run: make check

